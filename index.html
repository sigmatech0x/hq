<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="yandex" content="none"><meta name="bingbot" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>·</title>
<style>html,body{margin:0;background:#04070A}#m{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#4F8A65;font:13px ui-monospace,Menlo,monospace}</style>
</head><body><div id="m">…</div>
<script>
(async function(){
  var m=document.getElementById("m"), k=null, h=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(h){ k=h[1]; try{localStorage.setItem("hqk",k);}catch(e){} }
  else { try{ k=localStorage.getItem("hqk"); }catch(e){} }
  if(!k){ m.textContent="Нужна ссылка с ключом."; return; }
  try{
    var b=function(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); };
    var key=await crypto.subtle.importKey("raw",b(k),"AES-GCM",false,["decrypt"]);
    var r=await fetch("index.enc?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("нет данных");
    var d=b((await r.text()).trim());
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12));
    var html=new TextDecoder().decode(pt);
    if(h){ try{ history.replaceState(null,"",location.pathname); }catch(e){} }
    m.remove(); var ws=document.querySelector("style"); if(ws) ws.remove();
    document.open(); document.write(html); document.close();
  }catch(e){ m.textContent="Ключ не подошёл."; }
})();
</script></body></html>
